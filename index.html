<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Attendance App</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

  <div class="overlay">

    <h1>📚 Attendance App</h1>

    <!-- BIOMETRIC SECTION -->
    <div class="section biometric-section">

      <h2>🔐 Biometric Attendance</h2>

      <div class="button-group">

  <button class="present-btn"
    onclick="markAttendance('Biometric', 'Present')">
    Present
  </button>

  <button class="absent-btn"
    onclick="markAttendance('Biometric', 'Absent')">
    Absent
  </button>

  <button class="clear-btn"
    onclick="clearBiometric()">
    Clear
  </button>

</div>

      <div class="stats">
        <div class="history" id="bioHistory">
          No biometric attendance yet.
      </div>
        <p>Total Present: <span id="bioPresent">0</span></p>
        <p>Total Absent: <span id="bioAbsent">0</span></p>
        <p>Attendance Percentage:
          <span id="bioPercent">0%</span>
        </p>
      </div>

    </div>

    <!-- CLASS SECTION -->
    <div class="section">

      <h2>🏫 Class & Lab Attendance</h2>

      <div id="subjectsContainer"></div>

    </div>

    <!-- SUMMARY -->
    <div class="section summary-section">

      <h2>📊 Final Summary</h2>

      <div class="summary-box">
        <h3>🔐 Biometric Summary</h3>

        <p>
          Present:
          <span id="summaryBioPresent">0</span>
        </p>

        <p>
          Absent:
          <span id="summaryBioAbsent">0</span>
        </p>

        <p>
          Percentage:
          <span id="summaryBioPercent">0%</span>
        </p>
      </div>

      <div class="summary-box">
        <h3>📚 Class & Lab Summary</h3>

        <div id="allSummary"></div>
      </div>

    </div>

    <!-- PDF BUTTON -->
    <div class="pdf-section">

      <button class="pdf-btn" onclick="downloadPDF()">
        📄 Download Attendance PDF
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
